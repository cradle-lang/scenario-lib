name: Validate and compile scenario
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Published scenario folder ID
        required: true
        type: string
      revision:
        description: Commit, tag or branch containing the scenario
        required: true
        default: main
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted tooling from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false
      - name: Checkout selected content revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          path: content
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --prefix tooling
      - name: Install CradleXC
        run: |
          echo 'deb [trusted=yes] https://repo.cradle-lang.org/apt/ /' | sudo tee /etc/apt/sources.list.d/cradle.list
          sudo apt-get update
          sudo apt-get install -y cxc-core
      - name: Validate and compile selected source
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          bash tooling/scripts/compile-scenario.sh "$SCENARIO" "$GITHUB_WORKSPACE/content" "$GITHUB_WORKSPACE/scenario-output"
          cat "$GITHUB_WORKSPACE/scenario-output/report.md" >> "$GITHUB_STEP_SUMMARY"
